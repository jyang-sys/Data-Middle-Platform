<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>销售人员管理 · 数据中台</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;color:#172b4d;background:#f5f7fb;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,input,select{outline-offset:3px}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}a{text-decoration:none;color:inherit}.sidebar{width:110px;position:fixed;inset:0 auto 0 0;background:linear-gradient(#162f60,#102447);color:#b6c5e1;padding:24px 7px}.brand{display:flex;align-items:center;gap:7px;color:#fff;font-weight:700;justify-content:center;margin-bottom:30px}.brand b{background:#fff;color:#3454a0;padding:7px 10px;border-radius:8px;font-size:21px}.nav{display:flex;flex-direction:column;align-items:center;gap:10px;padding:19px 3px;border-radius:9px;font-size:12px;margin-bottom:8px}.nav i{font-style:normal;font-size:18px}.nav.active{background:white;color:#2c50ae;font-weight:600}.side-foot{position:absolute;bottom:20px;font-size:11px;text-align:center;width:96px}.side-foot:before{content:'●';color:#6090ff;margin-right:7px}main{margin-left:110px}header{height:55px;display:flex;align-items:center;justify-content:space-between;background:white;border-bottom:1px solid #e8edf5;padding:0 30px;color:#8090a8;font-size:12px}header span{border:1px solid #e8edf5;border-radius:5px;padding:5px 9px}.content{max-width:1700px;margin:auto;padding:30px}.heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.eyebrow{font-size:10px;letter-spacing:2px;color:#3866f6;font-weight:700}h1{font-size:28px;margin:9px 0}p{color:#8090a8;line-height:1.65;margin:5px 0}button,.btn{border:1px solid #dce3ef;border-radius:7px;background:white;padding:10px 15px;color:#40536f;font-weight:600}.primary{background:#3866f6;border-color:#3866f6;color:#fff}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:24px}.stat{background:white;border:1px solid #e8edf5;border-radius:12px;padding:20px 24px}.stat span{color:#8090a8;font-size:12px}.stat strong{display:block;font-size:29px;margin-top:10px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px}.panel{background:white;border:1px solid #e8edf5;border-radius:12px;overflow:hidden}.panel-head{padding:20px 23px;border-bottom:1px solid #eef1f7;display:flex;align-items:center;justify-content:space-between}h2{font-size:16px;margin:0}.panel-head small,.muted{color:#8090a8;font-size:12px}.filters{display:flex;gap:12px;padding:20px 23px;flex-wrap:wrap}label{display:flex;flex-direction:column;gap:7px;color:#65758c;font-size:12px}input,select{background:#fff;border:1px solid #dce3ef;border-radius:6px;padding:9px 10px;min-width:0;color:#203451}input::placeholder{color:#a0acbc}.filters label:first-child{flex:1;min-width:180px}.filters select{min-width:130px}.bulk{padding:12px 23px;background:#f8faff;border-top:1px solid #eef1f7;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;border-bottom:1px solid #eef1f7;padding:15px 18px;font-size:12px}th{background:#fafbfd;color:#8796ab;font-weight:500}td small{display:block;color:#94a0b2;font-size:10px;margin-top:6px}td:first-child,th:first-child{padding-right:0;width:34px}td select{width:165px}.pill{display:inline-block;background:#edf3ff;color:#4166b8;border-radius:5px;padding:5px 8px;font-size:11px}.pill.gray{color:#8796ab;background:#f1f3f7}.group-form{padding:18px;display:flex;gap:8px;align-items:end}.group-form label{flex:1}.group-form input{width:100%}.groups{list-style:none;margin:0;padding:0 18px}.groups li{border-top:1px solid #eef1f7;padding:13px 0;display:flex;align-items:center;gap:7px}.groups input{flex:1;width:80px;font-size:12px}.groups button{border:0;padding:6px;font-size:11px;color:#3866f6;font-weight:500}.hint{padding:17px 20px;color:#8796ab;font-size:12px;line-height:1.8}.savebar{margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:15px;font-size:12px;color:#8090a8}.status{border-radius:7px;padding:12px 16px;margin-bottom:18px;background:#eef4ff;color:#355da8;line-height:1.7}.status.error{background:#fff0f0;color:#b63434}.empty{text-align:center;padding:40px;color:#8796ab}.dirty{color:#b47a1e}input[type=checkbox]{accent-color:#3866f6}.group-empty{padding:20px;color:#8796ab;font-size:12px}a.back{color:#3866f6;font-size:12px}[hidden]{display:none!important}@media(max-width:1150px){.layout{grid-template-columns:minmax(0,1fr)}.groups{display:flex;gap:20px;flex-wrap:wrap}.groups li{width:240px}}@media(max-width:650px){.sidebar{width:75px}.brand{font-size:10px}.brand b{font-size:17px;padding:5px}.side-foot{width:60px;font-size:9px}main{margin-left:75px}.content{padding:20px 12px}header{padding:0 14px}.heading{align-items:start;flex-direction:column}h1{font-size:24px}.stats{gap:8px}.stat{padding:15px 10px}.stat strong{font-size:24px}.filters{padding:15px}.filters label{flex:1}.savebar{align-items:start;flex-direction:column}}
.person-form{padding:22px;display:grid;gap:16px}.person-form input,.person-form select{width:100%}.person-form .actions{margin-top:6px}.person-name{font-weight:600}.people-layout{grid-template-columns:minmax(0,1fr) 330px}@media(max-width:1150px){.people-layout{grid-template-columns:1fr}}.form-note{font-size:12px;line-height:1.8;color:#a77827;background:#fff9ec;border-radius:6px;padding:10px}.text-button{border:0;color:#3866f6;background:transparent;padding:5px 0}</style></head><body><aside class="sidebar"><a href="/" class="brand"><b>B</b>中台</a><a class="nav" href="/"><i>◈</i>销售总览</a><a class="nav" href="/settings/shops"><i>⚙</i>店铺归属</a><a class="nav active" href="/settings/people" aria-current="page"><i>♧</i>销售人员</a><div class="side-foot">Base 测试环境</div></aside><main><header><div>工作空间　/　设置　/　销售人员</div><span>Base 测试环境</span></header><div class="content"><div class="heading"><div><div class="eyebrow">SALES TEAM</div><h1>销售人员管理</h1><p>维护真实销售人员，明确所属小组与店铺负责人</p></div><div class="actions"><button id="reload">重新载入</button><button id="new" class="primary" disabled>＋ 新增人员</button></div></div><div id="status" class="status" role="status">正在读取人员资料…</div><div class="stats"><div class="stat"><span>全部人员</span><strong id="total">—</strong></div><div class="stat"><span>在职人员</span><strong id="active">—</strong></div><div class="stat"><span>待分组人员</span><strong id="unassigned">—</strong></div></div><div class="layout people-layout"><section class="panel"><div class="panel-head"><h2>销售人员</h2><small id="count"></small></div><div class="filters"><label>搜索人员<input id="search" placeholder="姓名或员工编号"></label><label>所属小组<select id="filter-group"><option value="">全部小组</option></select></label><label>状态<select id="filter-status"><option value="">全部状态</option><option value="active">在职</option><option value="inactive">停用</option></select></label></div><div class="table-wrap"><table><thead><tr><th style="padding-left:18px;width:auto">员工编号</th><th>姓名</th><th>所属销售小组</th><th>状态</th><th>负责店铺</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="hint" id="updated"></div></section><aside class="panel" style="align-self:start"><div class="panel-head"><h2 id="form-title">新增人员</h2><small id="edit-code"></small></div><form id="person-form" class="person-form"><label>员工编号<input id="person-code" required maxlength="40" placeholder="例如：XS001" autocomplete="off"></label><label>姓名<input id="person-name" required maxlength="80" placeholder="填写真实姓名" autocomplete="off"></label><label>所属销售小组<select id="person-group"><option value="">暂不分组</option></select></label><label>人员状态<select id="person-active"><option value="true">在职</option><option value="false">停用</option></select></label><div id="impact" class="form-note" hidden></div><div class="actions"><button type="submit" id="save" class="primary" disabled>保存人员</button><button type="button" id="cancel">取消编辑</button></div><p style="font-size:12px">员工编号创建后保持不变。离职人员设为停用，保留历史记录。</p><a href="/settings/shops" class="back">维护小组与店铺归属 ↗</a></form></aside></div><div class="savebar"><span>资料保存在服务端；人员调组或停用不会改写历史订单业绩。</span><a href="/settings/shops" class="back">配置店铺默认负责人 ↗</a></div></div></main><script>
const el=id=>document.getElementById(id);
let config=null,editing=null,busy=false,dirty=false;
function status(message,error=false){el('status').textContent=message;el('status').classList.toggle('error',error);el('status').hidden=!message;}
function controls(){document.querySelector('.content').inert=busy;el('new').disabled=busy||!config;el('save').disabled=busy||!config;el('person-code').disabled=Boolean(editing);}
function groupName(id){return config.groups.find(g=>g.id===id)?.name||'未分组';}
function affected(){if(!editing||!config)return [];const group=el('person-group').value||null,active=el('person-active').value==='true';return config.assignments.filter(s=>s.employee_id===editing&&(!active||!group||s.group_id!==group));}
function showImpact(){const list=affected();el('impact').hidden=!list.length;el('impact').textContent='此次调组或停用会清空 '+list.length+' 家店铺的默认负责人，店铺所属小组保留。历史订单业绩不变。';}
function render(){const all=config.employees||[];el('total').textContent=all.length;el('active').textContent=all.filter(p=>p.active).length;el('unassigned').textContent=all.filter(p=>p.active&&!p.group_id).length;const q=el('search').value.trim().toLowerCase(),g=el('filter-group').value,a=el('filter-status').value;const people=all.filter(p=>(!q||[p.code,p.name].some(v=>v.toLowerCase().includes(q)))&&(!g||(g==='__none'?!p.group_id:p.group_id===g))&&(!a||(a==='active')===p.active));el('count').textContent=people.length+' 人';el('rows').replaceChildren();for(const p of people){const tr=document.createElement('tr');for(const value of [p.code,p.name,groupName(p.group_id)])tr.insertCell().textContent=value;const pill=document.createElement('span');pill.className='pill'+(p.active?'':' gray');pill.textContent=p.active?'在职':'停用';tr.insertCell().append(pill);tr.insertCell().textContent=config.assignments.filter(s=>s.employee_id===p.id).length+' 家';const button=document.createElement('button');button.className='text-button';button.textContent='编辑';button.onclick=()=>edit(p);tr.insertCell().append(button);el('rows').append(tr);}if(!people.length){const td=el('rows').insertRow().insertCell();td.colSpan=6;td.className='empty';td.textContent=all.length?'没有符合条件的人员':'尚未添加销售人员，点击右侧表单创建';}el('updated').textContent=config.updated_at?'最后保存 '+new Date(config.updated_at).toLocaleString('zh-CN'):'人员资料尚未保存';}
function edit(person=null,force=false){if(!force&&dirty&&!confirm('当前有未保存的修改，是否放弃？'))return;editing=person?.id||null;dirty=false;el('form-title').textContent=person?'编辑人员':'新增人员';el('edit-code').textContent=person?.code||'';el('person-code').value=person?.code||'';el('person-name').value=person?.name||'';el('person-group').value=person?.group_id||'';el('person-active').value=person?.active===false?'false':'true';showImpact();controls();}
async function request(method='GET',body){const response=await fetch('/api/shop-settings',{method,credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});if(!(response.headers.get('content-type')||'').includes('application/json'))throw Error('人员接口暂时不可用，请刷新页面或重新登录');const result=await response.json();if(!response.ok)throw Error(result.detail||'操作失败');return result;}
async function load(){if(dirty&&!confirm('有未保存的修改，是否放弃并重新载入？'))return;busy=true;controls();try{config=await request();config.employees||=[];const current=el('filter-group').value;el('filter-group').replaceChildren(new Option('全部小组',''),new Option('未分组','__none'));el('person-group').replaceChildren(new Option('暂不分组',''));for(const g of config.groups){el('filter-group').add(new Option(g.name,g.id));el('person-group').add(new Option(g.name,g.id));}el('filter-group').value=current;edit(null,true);render();status('');}catch(e){status(e.message,true);}finally{busy=false;controls();}}
el('person-form').onsubmit=async event=>{event.preventDefault();if(!config||busy)return;const person={id:editing||crypto.randomUUID(),code:el('person-code').value.trim(),name:el('person-name').value.trim(),group_id:el('person-group').value||null,active:el('person-active').value==='true'};if(!person.code||!person.name)return status('请填写员工编号和姓名',true);if(config.employees.some(p=>p.id!==person.id&&p.code.toLowerCase()===person.code.toLowerCase()))return status('员工编号已存在，请使用唯一编号',true);const changes=structuredClone(config);changes.employees=changes.employees.filter(p=>p.id!==person.id);changes.employees.push(person);let cleared=0;for(const s of changes.assignments)if(s.employee_id===person.id&&(!person.active||!person.group_id||s.group_id!==person.group_id)){s.employee_id=null;cleared++;}busy=true;controls();try{const result=await request('PUT',{revision:changes.revision,groups:changes.groups,employees:changes.employees,assignments:changes.assignments});config={...changes,...result};dirty=false;render();edit(null,true);status('人员资料已保存'+(cleared?'；已清空 '+cleared+' 家店铺的默认负责人':'')+'。');}catch(e){status(e.message,true);}finally{busy=false;controls();}};
for(const id of ['person-code','person-name','person-group','person-active'])el(id).addEventListener('input',()=>{dirty=true;showImpact();});for(const id of ['search','filter-group','filter-status'])el(id).addEventListener(id==='search'?'input':'change',()=>config&&render());el('new').onclick=()=>edit();el('cancel').onclick=()=>edit();el('reload').onclick=load;window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});load();
</script></body></html>
