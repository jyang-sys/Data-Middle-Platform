<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店铺产品负责人 · 数据中台</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;color:#172b4d;background:#f5f7fb;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,input,select{outline-offset:3px}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}a{text-decoration:none;color:inherit}.sidebar{width:110px;position:fixed;inset:0 auto 0 0;background:linear-gradient(#162f60,#102447);color:#b6c5e1;padding:24px 7px}.brand{display:flex;align-items:center;gap:7px;color:#fff;font-weight:700;justify-content:center;margin-bottom:30px}.brand b{background:#fff;color:#3454a0;padding:7px 10px;border-radius:8px;font-size:21px}.nav{display:flex;flex-direction:column;align-items:center;gap:10px;padding:19px 3px;border-radius:9px;font-size:12px;margin-bottom:8px}.nav i{font-style:normal;font-size:18px}.nav.active{background:white;color:#2c50ae;font-weight:600}.side-foot{position:absolute;bottom:20px;font-size:11px;text-align:center;width:96px}.side-foot:before{content:'●';color:#6090ff;margin-right:7px}main{margin-left:110px}header{height:55px;display:flex;align-items:center;justify-content:space-between;background:white;border-bottom:1px solid #e8edf5;padding:0 30px;color:#8090a8;font-size:12px}header span{border:1px solid #e8edf5;border-radius:5px;padding:5px 9px}.content{max-width:1700px;margin:auto;padding:30px}.heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.eyebrow{font-size:10px;letter-spacing:2px;color:#3866f6;font-weight:700}h1{font-size:28px;margin:9px 0}p{color:#8090a8;line-height:1.65;margin:5px 0}button,.btn{border:1px solid #dce3ef;border-radius:7px;background:white;padding:10px 15px;color:#40536f;font-weight:600}.primary{background:#3866f6;border-color:#3866f6;color:#fff}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:24px}.stat{background:white;border:1px solid #e8edf5;border-radius:12px;padding:20px 24px}.stat span{color:#8090a8;font-size:12px}.stat strong{display:block;font-size:29px;margin-top:10px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px}.panel{background:white;border:1px solid #e8edf5;border-radius:12px;overflow:hidden}.panel-head{padding:20px 23px;border-bottom:1px solid #eef1f7;display:flex;align-items:center;justify-content:space-between}h2{font-size:16px;margin:0}.panel-head small,.muted{color:#8090a8;font-size:12px}.filters{display:flex;gap:12px;padding:20px 23px;flex-wrap:wrap}label{display:flex;flex-direction:column;gap:7px;color:#65758c;font-size:12px}input,select{background:#fff;border:1px solid #dce3ef;border-radius:6px;padding:9px 10px;min-width:0;color:#203451}input::placeholder{color:#a0acbc}.filters label:first-child{flex:1;min-width:180px}.filters select{min-width:130px}.bulk{padding:12px 23px;background:#f8faff;border-top:1px solid #eef1f7;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;border-bottom:1px solid #eef1f7;padding:15px 18px;font-size:12px}th{background:#fafbfd;color:#8796ab;font-weight:500}td small{display:block;color:#94a0b2;font-size:10px;margin-top:6px}td:first-child,th:first-child{padding-right:0;width:34px}td select{width:165px}.pill{display:inline-block;background:#edf3ff;color:#4166b8;border-radius:5px;padding:5px 8px;font-size:11px}.pill.gray{color:#8796ab;background:#f1f3f7}.group-form{padding:18px;display:flex;gap:8px;align-items:end}.group-form label{flex:1}.group-form input{width:100%}.groups{list-style:none;margin:0;padding:0 18px}.groups li{border-top:1px solid #eef1f7;padding:13px 0;display:flex;align-items:center;gap:7px}.groups input{flex:1;width:80px;font-size:12px}.groups button{border:0;padding:6px;font-size:11px;color:#3866f6;font-weight:500}.hint{padding:17px 20px;color:#8796ab;font-size:12px;line-height:1.8}.savebar{margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:15px;font-size:12px;color:#8090a8}.status{border-radius:7px;padding:12px 16px;margin-bottom:18px;background:#eef4ff;color:#355da8;line-height:1.7}.status.error{background:#fff0f0;color:#b63434}.empty{text-align:center;padding:40px;color:#8796ab}.dirty{color:#b47a1e}input[type=checkbox]{accent-color:#3866f6}.group-empty{padding:20px;color:#8796ab;font-size:12px}a.back{color:#3866f6;font-size:12px}[hidden]{display:none!important}@media(max-width:1150px){.layout{grid-template-columns:minmax(0,1fr)}.groups{display:flex;gap:20px;flex-wrap:wrap}.groups li{width:240px}}@media(max-width:650px){.sidebar{width:75px}.brand{font-size:10px}.brand b{font-size:17px;padding:5px}.side-foot{width:60px;font-size:9px}main{margin-left:75px}.content{padding:20px 12px}header{padding:0 14px}.heading{align-items:start;flex-direction:column}h1{font-size:24px}.stats{gap:8px}.stat{padding:15px 10px}.stat strong{font-size:24px}.filters{padding:15px}.filters label{flex:1}.savebar{align-items:start;flex-direction:column}}
.person-form{padding:22px;display:grid;gap:16px}.person-form input,.person-form select{width:100%}.person-form .actions{margin-top:6px}.person-name{font-weight:600}.people-layout{grid-template-columns:minmax(0,1fr) 330px}@media(max-width:1150px){.people-layout{grid-template-columns:1fr}}.form-note{font-size:12px;line-height:1.8;color:#a77827;background:#fff9ec;border-radius:6px;padding:10px}.text-button{border:0;color:#3866f6;background:transparent;padding:5px 0}</style></head><body><aside class="sidebar"><a href="/" class="brand"><b>B</b>中台</a><a class="nav" href="/"><i>◈</i>销售总览</a><a class="nav" href="/settings/shops"><i>⚙</i>店铺归属</a><a class="nav" href="/settings/people"><i>♧</i>销售人员</a><a class="nav active" href="/settings/product-owners" aria-current="page"><i>▦</i>产品负责人</a><div class="side-foot">Base 测试环境</div></aside><main><header><div>工作空间　/　设置　/　店铺产品负责人</div><span>Base 测试环境</span></header><div class="content"><div class="heading"><div><div class="eyebrow">PRODUCT OWNERSHIP</div><h1>店铺产品负责人</h1><p>同一店铺按产品分工，让不同运营人员负责不同规格</p></div><div class="actions"><button id="reload">重新载入</button><button id="save" class="primary" disabled>保存配置</button></div></div><div id="status" class="status" role="status">正在读取店铺与产品…</div><section class="panel" style="margin-bottom:22px"><div class="filters"><label style="flex:2;min-width:240px">选择店铺<select id="shop"><option value="">请选择店铺</option></select></label><label style="flex:1">销售小组<input id="shop-group" readonly placeholder="—"></label><label style="flex:1">店铺默认负责人<input id="shop-owner" readonly placeholder="未分配"></label></div><div id="shop-hint" class="hint" style="padding-top:0">选择店铺后配置产品负责人</div></section><div class="stats"><div class="stat"><span>可配置产品规格</span><strong id="total">—</strong></div><div class="stat"><span>已单独指定负责人</span><strong id="configured">—</strong></div><div class="stat"><span>未单独配置</span><strong id="remaining">—</strong></div></div><section class="panel"><div class="panel-head"><h2>产品分工</h2><small id="count"></small></div><div class="filters"><label>搜索产品<input id="search" placeholder="产品名称、公司编码或原 SKU"></label><label>归属方式<select id="filter"><option value="">全部产品</option><option value="configured">已单独指定</option><option value="default">沿用店铺默认</option><option value="unassigned">未分配负责人</option></select></label></div><div class="bulk"><span id="selected">已选 0 款</span><select id="bulk-person" aria-label="批量负责人"></select><button id="bulk" disabled>批量指定</button></div><div class="table-wrap"><table><thead><tr><th><input id="all" type="checkbox" aria-label="选择当前筛选产品"></th><th>产品 / 具体规格</th><th>单独指定负责人</th><th>当前配置负责人</th><th>归属方式</th></tr></thead><tbody id="rows"></tbody></table></div><div class="savebar" style="padding:0 23px 20px"><span id="updated"></span><span id="dirty"></span></div></section><div class="savebar"><span>单独指定的产品负责人优先于店铺默认负责人。本页维护责任配置，已有订单业绩保持原记录。</span><div class="actions"><a class="back" href="/settings/people">维护销售人员 ↗</a><a class="back" href="/settings/shops">店铺归属设置 ↗</a></div></div></div></main><script>
const el=id=>document.getElementById(id),shopKey=s=>JSON.stringify([s.platform,String(s.shop_id)]);
const labels={amazon:'Amazon',ebay:'eBay',allegro:'Allegro',shop:'独立站',personal:'手工来源',blconnect:'Base Connect',order_return:'退货来源'};
let state=null,rules=[],dirty=false,busy=false,chosen=new Set();
function status(message,error=false){el('status').textContent=message;el('status').classList.toggle('error',error);el('status').hidden=!message;}
function current(){return state?.shops.find(s=>shopKey(s)===el('shop').value);}
function assignment(){const shop=current();return shop?state.assignments.find(s=>shopKey(s)===shopKey(shop)):null;}
function eligible(){const group=assignment()?.group_id;return group?state.employees.filter(p=>p.active&&p.group_id===group):[];}
function personName(id){const p=state.employees.find(p=>p.id===id);return p?p.name+' · '+p.code:'未分配';}
function ruleFor(product){const shop=current();return shop?rules.find(r=>shopKey(r)===shopKey(shop)&&r.product_key===product.key):null;}
function canEdit(){return current()?.active!==false&&Boolean(assignment()?.group_id)&&eligible().length>0;}
function mark(){dirty=true;el('dirty').textContent='有未保存的修改';el('dirty').className='dirty';controls();}
function controls(){document.querySelector('.content').inert=busy;el('save').disabled=busy||!state||!dirty;el('bulk').disabled=busy||!canEdit()||!chosen.size;}
function options(select,value=''){const owner=assignment()?.employee_id;select.replaceChildren(new Option('沿用店铺默认'+(owner?'（'+personName(owner)+'）':''),''));for(const p of eligible())select.add(new Option(p.name+' · '+p.code,p.id));select.value=value||'';}
function products(){if(!current())return [];const known=new Map(state.products.map(p=>[p.key,p]));for(const r of rules.filter(r=>shopKey(r)===el('shop').value))if(!known.has(r.product_key))known.set(r.product_key,{key:r.product_key,code:r.product_key,name:'已失效产品',source_sku:'',active:false});return [...known.values()].filter(p=>p.active||ruleFor(p));}
function visible(){const q=el('search').value.trim().toLowerCase(),filter=el('filter').value;return products().filter(p=>{const rule=ruleFor(p),kind=rule?'configured':assignment()?.employee_id?'default':'unassigned';return(!q||[p.name,p.code,p.source_sku].some(v=>String(v||'').toLowerCase().includes(q)))&&(!filter||filter===kind);});}
function setRule(product,person){const shop=current();rules=rules.filter(r=>!(shopKey(r)===shopKey(shop)&&r.product_key===product.key));if(person)rules.push({platform:shop.platform,shop_id:String(shop.shop_id),product_key:product.key,employee_id:person});mark();}
function render(){if(!state)return;const shop=current(),a=assignment();el('shop-group').value=state.groups.find(g=>g.id===a?.group_id)?.name||'未分组';el('shop-owner').value=a?.employee_id?personName(a.employee_id):'未分配';el('shop-hint').textContent=!shop?'请选择店铺':shop.active===false?'该来源已停用，可移除原产品负责人':!a?.group_id?'请先在店铺归属设置中为该店铺分配销售小组':!eligible().length?'该小组还没有在职人员，请先添加销售人员':'选择该小组的在职人员负责具体规格；未单独配置的产品沿用店铺默认负责人。';const all=products(),configured=all.filter(p=>ruleFor(p)).length;el('total').textContent=all.length;el('configured').textContent=configured;el('remaining').textContent=all.length-configured;options(el('bulk-person'));const list=visible();el('count').textContent=list.length+' 款';el('rows').replaceChildren();for(const p of list){const tr=document.createElement('tr'),check=document.createElement('input');check.type='checkbox';check.checked=chosen.has(p.key);check.disabled=!canEdit()||!p.active;check.setAttribute('aria-label','选择 '+p.name);check.onchange=()=>{check.checked?chosen.add(p.key):chosen.delete(p.key);renderSelected();};tr.insertCell().append(check);const name=tr.insertCell();name.append(document.createTextNode(p.name));const code=document.createElement('small');code.textContent=(p.source_sku?p.source_sku+' · ':'')+p.code;name.append(code);const rule=ruleFor(p),select=document.createElement('select');select.setAttribute('aria-label',p.name+' 的负责人');options(select,rule?.employee_id);select.disabled=!canEdit()||!p.active;const cell=tr.insertCell();cell.append(select);if(rule&&(!p.active||shop.active===false)){const remove=document.createElement('button');remove.textContent='移除配置';remove.className='text-button';remove.onclick=()=>{setRule(p,'');render();};cell.append(remove);}select.onchange=()=>{setRule(p,select.value);render();};tr.insertCell().textContent=personName(rule?.employee_id||a?.employee_id);const pill=document.createElement('span');pill.className='pill'+(!rule?' gray':'');pill.textContent=rule?'单独指定':a?.employee_id?'店铺默认':'未分配';tr.insertCell().append(pill);el('rows').append(tr);}if(!list.length){const td=el('rows').insertRow().insertCell();td.colSpan=5;td.className='empty';td.textContent=!shop?'请先选择店铺':'没有符合条件的产品；新增产品可在销售总览刷新 Base 数据后重新载入';}renderSelected();controls();}
function renderSelected(){el('selected').textContent='已选 '+chosen.size+' 款';const selectable=visible().filter(p=>p.active&&canEdit());el('all').checked=selectable.length>0&&selectable.every(p=>chosen.has(p.key));el('all').indeterminate=selectable.some(p=>chosen.has(p.key))&&!el('all').checked;controls();}
async function request(method='GET',body){const response=await fetch('/api/shop-settings',{method,credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});if(!(response.headers.get('content-type')||'').includes('application/json'))throw Error('配置接口暂时不可用，请刷新页面或重新登录');const result=await response.json();if(!response.ok)throw Error(result.detail||'操作失败');return result;}
async function load(){if(dirty&&!confirm('重新载入会丢弃未保存的产品分工，是否继续？'))return;busy=true;controls();try{const data=await request();state=data;state.employees||=[];state.products||=[];rules=structuredClone(data.product_owners||[]);dirty=false;chosen.clear();el('dirty').textContent='';const params=new URLSearchParams(location.search),wanted=el('shop').value||(params.has('platform')&&params.has('shop_id')?JSON.stringify([params.get('platform'),params.get('shop_id')]):'');el('shop').replaceChildren(new Option('请选择店铺',''));for(const s of data.shops)el('shop').add(new Option((labels[s.platform]||s.platform)+' / '+s.name+(s.active===false?'（已停用）':''),shopKey(s)));el('shop').value=wanted;el('updated').textContent=data.updated_at?'最后保存 '+new Date(data.updated_at).toLocaleString('zh-CN'):'尚未保存配置';render();status('');}catch(e){status(e.message,true);}finally{busy=false;controls();}}
el('save').onclick=async()=>{busy=true;controls();try{const result=await request('PUT',{revision:state.revision,groups:state.groups,employees:state.employees,assignments:state.assignments,product_owners:rules});state.revision=result.revision;dirty=false;el('dirty').textContent='已保存';el('dirty').className='';el('updated').textContent='最后保存 '+new Date(result.updated_at).toLocaleString('zh-CN');status('产品负责人配置已保存');}catch(e){status(e.message,true);}finally{busy=false;controls();}};
el('shop').onchange=()=>{chosen.clear();render();};for(const id of ['search','filter'])el(id).addEventListener(id==='search'?'input':'change',()=>{chosen.clear();render();});el('all').onchange=()=>{for(const p of visible().filter(p=>p.active&&canEdit()))el('all').checked?chosen.add(p.key):chosen.delete(p.key);render();};el('bulk').onclick=()=>{const employee=el('bulk-person').value;for(const p of products().filter(p=>chosen.has(p.key)&&p.active))setRule(p,employee);render();};el('reload').onclick=load;window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});load();
</script></body></html>
