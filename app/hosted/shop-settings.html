<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店铺归属设置 · 数据中台</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;color:#172b4d;background:#f5f7fb;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,input,select{outline-offset:3px}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}a{text-decoration:none;color:inherit}.sidebar{width:110px;position:fixed;inset:0 auto 0 0;background:linear-gradient(#162f60,#102447);color:#b6c5e1;padding:24px 7px}.brand{display:flex;align-items:center;gap:7px;color:#fff;font-weight:700;justify-content:center;margin-bottom:30px}.brand b{background:#fff;color:#3454a0;padding:7px 10px;border-radius:8px;font-size:21px}.nav{display:flex;flex-direction:column;align-items:center;gap:10px;padding:19px 3px;border-radius:9px;font-size:12px;margin-bottom:8px}.nav i{font-style:normal;font-size:18px}.nav.active{background:white;color:#2c50ae;font-weight:600}.side-foot{position:absolute;bottom:20px;font-size:11px;text-align:center;width:96px}.side-foot:before{content:'●';color:#6090ff;margin-right:7px}main{margin-left:110px}header{height:55px;display:flex;align-items:center;justify-content:space-between;background:white;border-bottom:1px solid #e8edf5;padding:0 30px;color:#8090a8;font-size:12px}header span{border:1px solid #e8edf5;border-radius:5px;padding:5px 9px}.content{max-width:1700px;margin:auto;padding:30px}.heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.eyebrow{font-size:10px;letter-spacing:2px;color:#3866f6;font-weight:700}h1{font-size:28px;margin:9px 0}p{color:#8090a8;line-height:1.65;margin:5px 0}button,.btn{border:1px solid #dce3ef;border-radius:7px;background:white;padding:10px 15px;color:#40536f;font-weight:600}.primary{background:#3866f6;border-color:#3866f6;color:#fff}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:24px}.stat{background:white;border:1px solid #e8edf5;border-radius:12px;padding:20px 24px}.stat span{color:#8090a8;font-size:12px}.stat strong{display:block;font-size:29px;margin-top:10px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px}.panel{background:white;border:1px solid #e8edf5;border-radius:12px;overflow:hidden}.panel-head{padding:20px 23px;border-bottom:1px solid #eef1f7;display:flex;align-items:center;justify-content:space-between}h2{font-size:16px;margin:0}.panel-head small,.muted{color:#8090a8;font-size:12px}.filters{display:flex;gap:12px;padding:20px 23px;flex-wrap:wrap}label{display:flex;flex-direction:column;gap:7px;color:#65758c;font-size:12px}input,select{background:#fff;border:1px solid #dce3ef;border-radius:6px;padding:9px 10px;min-width:0;color:#203451}input::placeholder{color:#a0acbc}.filters label:first-child{flex:1;min-width:180px}.filters select{min-width:130px}.bulk{padding:12px 23px;background:#f8faff;border-top:1px solid #eef1f7;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;border-bottom:1px solid #eef1f7;padding:15px 18px;font-size:12px}th{background:#fafbfd;color:#8796ab;font-weight:500}td small{display:block;color:#94a0b2;font-size:10px;margin-top:6px}td:first-child,th:first-child{padding-right:0;width:34px}td select{width:165px}.pill{display:inline-block;background:#edf3ff;color:#4166b8;border-radius:5px;padding:5px 8px;font-size:11px}.pill.gray{color:#8796ab;background:#f1f3f7}.group-form{padding:18px;display:flex;gap:8px;align-items:end}.group-form label{flex:1}.group-form input{width:100%}.groups{list-style:none;margin:0;padding:0 18px}.groups li{border-top:1px solid #eef1f7;padding:13px 0;display:flex;align-items:center;gap:7px}.groups input{flex:1;width:80px;font-size:12px}.groups button{border:0;padding:6px;font-size:11px;color:#3866f6;font-weight:500}.hint{padding:17px 20px;color:#8796ab;font-size:12px;line-height:1.8}.savebar{margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:15px;font-size:12px;color:#8090a8}.status{border-radius:7px;padding:12px 16px;margin-bottom:18px;background:#eef4ff;color:#355da8;line-height:1.7}.status.error{background:#fff0f0;color:#b63434}.empty{text-align:center;padding:40px;color:#8796ab}.dirty{color:#b47a1e}input[type=checkbox]{accent-color:#3866f6}.group-empty{padding:20px;color:#8796ab;font-size:12px}a.back{color:#3866f6;font-size:12px}[hidden]{display:none!important}@media(max-width:1150px){.layout{grid-template-columns:minmax(0,1fr)}.groups{display:flex;gap:20px;flex-wrap:wrap}.groups li{width:240px}}@media(max-width:650px){.sidebar{width:75px}.brand{font-size:10px}.brand b{font-size:17px;padding:5px}.side-foot{width:60px;font-size:9px}main{margin-left:75px}.content{padding:20px 12px}header{padding:0 14px}.heading{align-items:start;flex-direction:column}h1{font-size:24px}.stats{gap:8px}.stat{padding:15px 10px}.stat strong{font-size:24px}.filters{padding:15px}.filters label{flex:1}.savebar{align-items:start;flex-direction:column}}
</style></head><body><aside class="sidebar"><a href="/" class="brand"><b>B</b>中台</a><a class="nav" href="/"><i>◈</i>销售总览</a><a class="nav" href="/#stock-dashboard"><i>▦</i>库存中心</a><a class="nav" href="/#catalog"><i>▤</i>产品中心</a><a class="nav active" href="/settings/shops" aria-current="page"><i>⚙</i>店铺归属</a><div class="side-foot">Base 测试环境</div></aside><main><header><div>工作空间　/　设置　/　店铺归属</div><span>Base 测试环境</span></header><div class="content"><div class="heading"><div><div class="eyebrow">SHOP OWNERSHIP</div><h1>店铺归属设置</h1><p>为各来源店铺配置默认销售小组</p></div><div class="actions"><button id="reload" disabled>重新载入</button><button id="save" class="primary" disabled>保存配置</button></div></div><div id="status" class="status" role="status">正在读取店铺与归属配置…</div><div class="stats"><div class="stat"><span>来源店铺</span><strong id="total">—</strong></div><div class="stat"><span>已分配店铺</span><strong id="assigned">—</strong></div><div class="stat"><span>待分配店铺</span><strong id="unassigned">—</strong></div></div><div class="layout"><section class="panel"><div class="panel-head"><h2>店铺与销售小组</h2><small id="count"></small></div><div class="filters"><label>搜索店铺<input id="search" placeholder="店铺名称或来源 ID"></label><label>来源平台<select id="platform"><option value="">全部来源</option></select></label><label>归属状态<select id="filter"><option value="">全部店铺</option><option value="assigned">已分配</option><option value="unassigned">未分配</option></select></label></div><div class="bulk"><span id="selected">已选 0 家</span><select id="bulk-group" aria-label="批量销售小组"></select><button id="bulk" disabled>批量分配</button></div><div class="table-wrap"><table><thead><tr><th><input type="checkbox" id="all" aria-label="选择当前筛选结果"></th><th>店铺名称 / 来源 ID</th><th>来源平台</th><th>销售小组</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table></div><div class="savebar" style="padding:0 23px 20px"><span id="updated">尚未保存配置</span><span id="dirty"></span></div></section><aside class="panel" style="align-self:start"><div class="panel-head"><h2>销售小组</h2><small id="group-count">0 个</small></div><form class="group-form" id="group-form"><label>新增小组<input id="group-name" maxlength="80" required placeholder="例如：欧洲一组"></label><button type="submit" id="add-group" disabled>添加</button></form><ul class="groups" id="groups"></ul><div class="hint">小组可重命名。店铺可以调整到其他小组，也可以设为“未分配”。</div></aside></div><div class="savebar"><span>配置保存在服务端。用于店铺默认归属，已有订单业绩不会自动改写。</span><a class="back" href="/">返回销售总览 ↗</a></div></div></main><script>
const el=id=>document.getElementById(id), identity=s=>JSON.stringify([s.platform,String(s.shop_id)]);
const labels={amazon:'Amazon',ebay:'eBay',allegro:'Allegro',shop:'独立站',personal:'手工来源',blconnect:'Base Connect',order_return:'退货来源'};
let state=null,draft=null,dirty=false,busy=false,chosen=new Set();
function status(message,error=false){el('status').textContent=message;el('status').classList.toggle('error',error);el('status').hidden=!message;}
function mark(){dirty=true;el('dirty').textContent='有未保存的修改';el('dirty').className='dirty';controls();}
function controls(){document.querySelector('.content').inert=busy;el('save').disabled=!state||busy||!dirty;el('reload').disabled=busy;el('add-group').disabled=!state||busy;el('bulk').disabled=!state||busy||!chosen.size;}
function groupOptions(select,value=''){select.replaceChildren(new Option('未分配',''));for(const g of draft.groups)select.add(new Option(g.name,g.id));select.value=value||'';}
function filtered(){const search=el('search').value.trim().toLowerCase();return state.shops.filter(s=>(!el('platform').value||s.platform===el('platform').value)&&(!search||[s.name,s.shop_id,s.platform].some(x=>String(x).toLowerCase().includes(search)))&&(!el('filter').value||(el('filter').value==='assigned')===Boolean(draft.assignments.find(a=>identity(a)===identity(s))?.group_id)));}
function renderRows(){if(!state)return;const rows=el('rows');rows.replaceChildren();let assigned=0;for(const s of state.shops)if(draft.assignments.find(a=>identity(a)===identity(s))?.group_id)assigned++;el('total').textContent=state.shops.length;el('assigned').textContent=assigned;el('unassigned').textContent=state.shops.length-assigned;const visible=filtered();el('count').textContent=visible.length+' 家店铺';for(const s of visible){const tr=document.createElement('tr'),check=document.createElement('input');check.type='checkbox';check.checked=chosen.has(identity(s));check.disabled=s.active===false;check.setAttribute('aria-label','选择 '+s.name);check.onchange=()=>{check.checked?chosen.add(identity(s)):chosen.delete(identity(s));renderRows();};tr.insertCell().append(check);const name=tr.insertCell();name.append(document.createTextNode(s.name||s.shop_id));const id=document.createElement('small');id.textContent='ID: '+s.shop_id;name.append(id);tr.insertCell().textContent=labels[s.platform]||s.platform;const select=document.createElement('select');select.setAttribute('aria-label',s.name+' 的销售小组');const assignment=draft.assignments.find(a=>identity(a)===identity(s));groupOptions(select,assignment?.group_id);select.disabled=s.active===false;select.onchange=()=>{assignment.group_id=select.value||null;mark();renderRows();};tr.insertCell().append(select);const pill=document.createElement('span');pill.className='pill'+(!assignment?.group_id?' gray':'');pill.textContent=s.active===false?'来源已停用':assignment?.group_id?'已分配':'未分配';tr.insertCell().append(pill);rows.append(tr);}if(!visible.length){const tr=rows.insertRow(),td=tr.insertCell();td.colSpan=5;td.className='empty';td.textContent='没有符合条件的店铺';}el('selected').textContent='已选 '+chosen.size+' 家';const enabled=visible.filter(s=>s.active!==false);el('all').checked=enabled.length>0&&enabled.every(s=>chosen.has(identity(s)));el('all').indeterminate=enabled.some(s=>chosen.has(identity(s)))&&!el('all').checked;controls();}
function renderGroups(){el('group-count').textContent=draft.groups.length+' 个';el('groups').replaceChildren();for(const g of draft.groups){const li=document.createElement('li'),input=document.createElement('input'),button=document.createElement('button');input.value=g.name;input.maxLength=80;input.setAttribute('aria-label','小组名称 '+g.name);button.type='button';button.textContent='确认改名';button.onclick=()=>{const name=input.value.trim();if(!name||draft.groups.some(x=>x.id!==g.id&&x.name.toLowerCase()===name.toLowerCase()))return status('小组名称不能为空或重复',true);g.name=name;mark();renderGroups();renderRows();status('小组名称已修改，点击“保存配置”生效');};li.append(input,button);el('groups').append(li);}if(!draft.groups.length){const li=document.createElement('li');li.className='group-empty';li.textContent='先添加销售小组，再分配店铺';el('groups').append(li);}groupOptions(el('bulk-group'));}
async function request(method,body){const response=await fetch('/api/shop-settings',{method,credentials:'same-origin',headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{}),cache:'no-store'});const result=await response.json();if(!response.ok)throw Error(result.detail||'操作失败，请稍后重试');return result;}
async function load(){if(dirty&&!confirm('有未保存的修改，重新载入会丢弃这些修改。继续吗？'))return;busy=true;controls();try{const data=await request('GET');state=data;draft={revision:data.revision,groups:structuredClone(data.groups),assignments:data.shops.map(s=>({platform:s.platform,shop_id:String(s.shop_id),group_id:data.assignments.find(a=>identity(a)===identity(s))?.group_id||null}))};chosen.clear();dirty=false;el('dirty').textContent='';el('updated').textContent=data.updated_at?'最后保存 '+new Date(data.updated_at).toLocaleString('zh-CN'):'尚未保存配置';const current=el('platform').value;el('platform').replaceChildren(new Option('全部来源',''));for(const p of [...new Set(data.shops.map(s=>s.platform))])el('platform').add(new Option(labels[p]||p,p));el('platform').value=current;renderGroups();renderRows();status('');}catch(e){status(e.message,true);}finally{busy=false;controls();}}
el('save').onclick=async()=>{busy=true;controls();try{const result=await request('PUT',draft);draft.revision=result.revision;state.revision=result.revision;dirty=false;el('dirty').textContent='已保存';el('dirty').className='';el('updated').textContent='最后保存 '+new Date(result.updated_at).toLocaleString('zh-CN');status('店铺归属已保存，重新打开或换电脑后仍可读取。');}catch(e){status(e.message,true);}finally{busy=false;controls();}};
el('group-form').onsubmit=event=>{event.preventDefault();if(!draft||busy)return;const name=el('group-name').value.trim();if(!name||draft.groups.some(g=>g.name.toLowerCase()===name.toLowerCase()))return status('小组名称不能为空或重复',true);if(draft.groups.length>=200)return status('最多维护 200 个小组',true);draft.groups.push({id:crypto.randomUUID(),name});el('group-name').value='';mark();renderGroups();renderRows();status('小组已添加，配置完成后点击“保存配置”');};
el('all').onchange=()=>{for(const s of filtered().filter(s=>s.active!==false))el('all').checked?chosen.add(identity(s)):chosen.delete(identity(s));renderRows();};el('bulk').onclick=()=>{for(const s of draft.assignments)if(chosen.has(identity(s)))s.group_id=el('bulk-group').value||null;mark();renderRows();};for(const id of ['search','platform','filter'])el(id).addEventListener(id==='search'?'input':'change',()=>{chosen.clear();renderRows();});el('reload').onclick=load;window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});load();
</script></body></html>
